services:
  postgres:
    image: postgres:16-alpine
    container_name: resolvex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resolvex_dev
      POSTGRES_USER: resolvex_dev
      POSTGRES_PASSWORD: resolvex_dev_password
    ports:
      - "5432:5432"
    volumes:
      - resolvex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolvex_dev -d resolvex_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
    container_name: resolvex-ai-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: resolvex-ai-service
      OCR_PROVIDER: ${OCR_PROVIDER:-local}
      AWS_TEXTRACT_ENABLED: ${AWS_TEXTRACT_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SPACY_MODEL: ${SPACY_MODEL:-blank:en}
      HF_CLASSIFICATION_ENABLED: ${HF_CLASSIFICATION_ENABLED:-false}
      HF_CLASSIFICATION_MODEL: ${HF_CLASSIFICATION_MODEL:-distilbert-base-uncased-finetuned-sst-2-english}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-10485760}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: resolvex-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-resolvex_dev}:${POSTGRES_PASSWORD:-resolvex_dev_password}@postgres:5432/${POSTGRES_DB:-resolvex_dev}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local_demo_jwt_secret_change_me_1234567890}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DISPUTE_MERCHANT_RESPONSE_DAYS: ${DISPUTE_MERCHANT_RESPONSE_DAYS:-7}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: /app/storage/evidence
      MAX_EVIDENCE_FILE_SIZE_BYTES: ${MAX_EVIDENCE_FILE_SIZE_BYTES:-10485760}
      EVIDENCE_UPLOAD_URL_TTL_SECONDS: ${EVIDENCE_UPLOAD_URL_TTL_SECONDS:-600}
      EVIDENCE_DOWNLOAD_URL_TTL_SECONDS: ${EVIDENCE_DOWNLOAD_URL_TTL_SECONDS:-300}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:3000}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-15000}
      AI_SERVICE_RETRY_ATTEMPTS: ${AI_SERVICE_RETRY_ATTEMPTS:-2}
      AI_SERVICE_RETRY_BACKOFF_MS: ${AI_SERVICE_RETRY_BACKOFF_MS:-150}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-100}
      UPLOAD_RATE_LIMIT_MAX: ${UPLOAD_RATE_LIMIT_MAX:-120}
      POLICY_AUTO_CONFIDENCE_THRESHOLD: ${POLICY_AUTO_CONFIDENCE_THRESHOLD:-85}
      POLICY_AUTO_DECISION_MARGIN_THRESHOLD: ${POLICY_AUTO_DECISION_MARGIN_THRESHOLD:-20}
      POLICY_CRITICAL_FACT_CONFIDENCE_THRESHOLD: ${POLICY_CRITICAL_FACT_CONFIDENCE_THRESHOLD:-0.8}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      RESOLVEX_DEMO_PASSWORD: ${RESOLVEX_DEMO_PASSWORD:-ResolveXDemo123!}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - resolvex-evidence-data:/app/storage/evidence
    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy && npm run prisma:seed && node dist/src/main.js",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  resolvex-postgres-data:
  resolvex-evidence-data:
